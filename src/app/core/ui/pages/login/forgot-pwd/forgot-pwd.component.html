<div class="app--login">
  <div class="app--login--content">
    <p-card>
      <div class="flex flex-col gap-3 items-center text-center">
        <div class="w-full flex justify-center m-5">
          <img alt="logo" height="50" src="images/angular.svg" width="50"/>
        </div>
        <p class="m-2 text-2xl">{{ 'forgotPassword.title' | translate }}</p>
        <p class="w-96 m-2 text-lg">{{ 'forgotPassword.description' | translate }}</p>
        <form [formGroup]="forgotPwdForm" class="flex flex-col gap-3 w-full">
          <p-floatlabel class="w-full" variant="on">
            <input autocomplete="off" class="w-full" formControlName="email" id="email" pInputText/>
            <label for="email">{{ 'common.email' | translate }}</label>
          </p-floatlabel>
          <div class="m-4">
            <p-button (click)="forgotPassword()" label="'forgotPassword.sendMail' | translate"/>
          </div>
        </form>
      </div>
    </p-card>
  </div>
</div>
