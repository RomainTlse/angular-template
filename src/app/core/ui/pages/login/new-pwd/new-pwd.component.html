<div class="app--login">
  <div class="app--login--content">
    <p-card>
      <div class="flex flex-col gap-3 items-center text-center">
        <div class="w-full flex justify-center m-5">
          <img alt="logo" height="50" src="images/angular.svg" width="50"/>
        </div>
        <p class="m-2 text-2xl">{{ 'newPassword.title' | translate }}</p>
        <p class="m-2 text-lg w-96">{{ 'newPassword.description' | translate }}</p>
        <form [formGroup]="newPwdForm" class="flex flex-col gap-3 w-full">
          <p-floatlabel class="w-full" variant="on">
            <p-password [toggleMask]="true" formControlName="password" id="pwd" inputId="pwd"/>
            <label for="pwd">{{ 'common.password' | translate }}</label>
          </p-floatlabel>
          <p-floatlabel class="w-full" variant="on">
            <p-password
              [toggleMask]="true"
              formControlName="confirmPassword"
              id="confirm-pwd"
              inputId="confirm-pwd"
            />
            <label for="confirm-pwd">{{ 'common.confirmation' | translate }}</label>
          </p-floatlabel>
          <div class="m-4">
            <p-button (click)="newPassword()" [label]="'common.toSave' | translate"/>
          </div>
        </form>
      </div>
    </p-card>
  </div>
</div>
